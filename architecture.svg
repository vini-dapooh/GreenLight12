<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbf6"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f9d58"/><stop offset="1" stop-color="#0b6e4f"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b2a1c" flood-opacity="0.10"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1600" height="1010" fill="url(#bg)"/>

  <!-- title -->
  <circle cx="62" cy="52" r="22" fill="#12b76a"/><circle cx="62" cy="52" r="22" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>
  <path d="M51 52 l8 8 l14 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="52" font-size="32" font-weight="800" fill="#0b2a1c">GreenLight</text>
  <text x="96" y="78" font-size="16" fill="#475569">Is this packaging artwork ready to launch? How the checker works, end to end</text>

  <!-- ===== column headers ===== -->
  <g font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">
    <text x="25" y="140">INPUTS</text>
    <text x="345" y="140">1 · EXTRACT</text>
    <text x="665" y="140">2 · PARSE</text>
    <text x="985" y="140">3 · CHECK</text>
    <text x="1305" y="140">4 · REPORT</text>
  </g>

  <!-- ===== INPUTS ===== -->
  <g filter="url(#sh)">
    <rect x="25" y="155" width="270" height="175" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <rect x="25" y="355" width="270" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <rect x="25" y="530" width="270" height="170" rx="16" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <g font-size="17" font-weight="700" fill="#0f172a">
    <text x="45" y="190">Packaging artwork</text>
    <text x="45" y="390">Approved sheet</text>
    <text x="45" y="565">Rules</text>
  </g>
  <g font-size="13.5" fill="#475569">
    <text x="45" y="214">PDF with text layers, or</text><text x="45" y="233">PNG / JPG print file</text>
    <text x="45" y="262">Dielines, panels, barcode,</text><text x="45" y="281">nutrition panel, claims</text>
    <text x="45" y="414">Excel (.xlsx): ingredients,</text><text x="45" y="433">claims, net weight, UPC</text>
    <text x="45" y="458">Cells flagged “verify / assumed”</text><text x="45" y="477">are marked unverified</text>
    <text x="45" y="592">Regulation YAML (US FDA)</text>
    <text x="45" y="622">Company rulebook (.md):</text><text x="45" y="641">plain-English clauses</text>
    <text x="45" y="670">Vague clauses go to manual review</text>
  </g>
  <!-- icons -->
  <rect x="245" y="170" width="34" height="42" rx="5" fill="#e0f2fe" stroke="#38bdf8"/><path d="M252 184h20M252 192h20M252 200h12" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="245" y="372" width="34" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/><path d="M245 384h34M245 395h34M257 372v34" stroke="#16a34a" stroke-width="2"/>
  <rect x="245" y="546" width="34" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/><path d="M252 556h20M252 564h20M252 572h12" stroke="#d97706" stroke-width="2.5"/>

  <!-- ===== EXTRACT ===== -->
  <g filter="url(#sh)"><rect x="345" y="155" width="270" height="265" rx="16" fill="#fff" stroke="#38bdf8" stroke-width="2"/></g>
  <rect x="345" y="155" width="270" height="44" rx="16" fill="#0ea5e9"/><rect x="345" y="180" width="270" height="19" fill="#0ea5e9"/>
  <text x="365" y="184" font-size="17" font-weight="700" fill="#fff">Read it like a prepress tool</text>
  <g font-size="13.5" fill="#334155">
    <text x="365" y="228">• Text layer with exact positions</text>
    <text x="365" y="252">• Dieline guide text separated out</text>
    <text x="365" y="276">• Panels found from crease vectors</text>
    <text x="365" y="300">• Clean render, guide layers off</text>
    <text x="365" y="324">• OCR as an independent witness</text>
    <text x="365" y="348">• Barcode decoded from the bars</text>
  </g>
  <rect x="363" y="362" width="234" height="40" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="378" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Text in file but OCR can’t see it?</text>
  <text x="480" y="394" font-size="12.5" fill="#92400e" text-anchor="middle">= hidden / covered text</text>

  <!-- ===== PARSE ===== -->
  <g filter="url(#sh)"><rect x="665" y="155" width="270" height="265" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="2"/></g>
  <rect x="665" y="155" width="270" height="44" rx="16" fill="#8b5cf6"/><rect x="665" y="180" width="270" height="19" fill="#8b5cf6"/>
  <text x="685" y="184" font-size="17" font-weight="700" fill="#fff">Turn text into structure</text>
  <g font-size="13.5" fill="#334155">
    <text x="685" y="228">• Nutrition rows and %DV</text>
    <text x="685" y="252">• Ingredients and allergens</text>
    <text x="685" y="276">• Claims and certification marks</text>
    <text x="685" y="300">• Net quantity, serving size</text>
    <text x="685" y="324">• Manufacturer, UPC, type size</text>
  </g>
  <rect x="683" y="344" width="234" height="58" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="800" y="368" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Every item keeps its</text>
  <text x="800" y="388" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">bounding box on the artwork</text>

  <!-- ===== CHECK ===== -->
  <g filter="url(#sh)"><rect x="985" y="155" width="270" height="545" rx="16" fill="#fff" stroke="#12b76a" stroke-width="2.5"/></g>
  <rect x="985" y="155" width="270" height="44" rx="16" fill="url(#hd)"/><rect x="985" y="180" width="270" height="19" fill="#0b6e4f"/>
  <text x="1005" y="184" font-size="17" font-weight="700" fill="#fff">Rule engine · plain code</text>
  <text x="1005" y="228" font-size="13" font-weight="700" fill="#0b6e4f">23 DETERMINISTIC CHECKS</text>
  <g font-size="13.5" fill="#334155">
    <text x="1005" y="254">• %DV and calorie arithmetic</text>
    <text x="1005" y="278">• Allergens vs ingredients</text>
    <text x="1005" y="302">• Artwork vs approved sheet</text>
    <text x="1005" y="326">• Claims: “vegan”, “no added sugar”</text>
    <text x="1005" y="350">• Net weight, units, address</text>
    <text x="1005" y="374">• UPC check digit and sheet match</text>
    <text x="1005" y="398">• Hidden or conflicting panels</text>
    <text x="1005" y="422">• Minimum type size</text>
  </g>
  <line x1="1005" y1="446" x2="1235" y2="446" stroke="#e2e8f0"/>
  <text x="1005" y="472" font-size="13" font-weight="700" fill="#0b6e4f">RULEBOOK ROUTER</text>
  <g font-size="13.5" fill="#334155">
    <text x="1005" y="496">Each clause is split into one rule,</text>
    <text x="1005" y="516">then matched to an existing check</text>
    <text x="1005" y="536">by keyword, or by the AI choosing</text>
    <text x="1005" y="556">only from a closed list of checks.</text>
  </g>
  <rect x="1005" y="578" width="230" height="102" rx="12" fill="#ecfdf3" stroke="#6ce9a6"/>
  <text x="1120" y="605" font-size="13" font-weight="700" fill="#085d3a" text-anchor="middle">A rule with no automatic check</text>
  <text x="1120" y="625" font-size="13" font-weight="700" fill="#085d3a" text-anchor="middle">is never skipped.</text>
  <text x="1120" y="652" font-size="12.5" fill="#085d3a" text-anchor="middle">It appears as a manual item</text>
  <text x="1120" y="670" font-size="12.5" fill="#085d3a" text-anchor="middle">for a human to review.</text>

  <!-- ===== REPORT ===== -->
  <g filter="url(#sh)">
    <rect x="1305" y="155" width="270" height="110" rx="16" fill="#fff1f0" stroke="#f04438" stroke-width="2"/>
    <rect x="1305" y="285" width="270" height="110" rx="16" fill="#fffaeb" stroke="#f79009" stroke-width="2"/>
    <rect x="1305" y="415" width="270" height="110" rx="16" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  </g>
  <circle cx="1345" cy="210" r="19" fill="#f04438"/><path d="M1337 202l16 16M1353 202l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1345" cy="340" r="19" fill="#f79009"/><text x="1345" y="349" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">!</text>
  <circle cx="1345" cy="470" r="19" fill="#12b76a"/><path d="M1336 470l7 7l12 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="17" font-weight="800">
    <text x="1380" y="203" fill="#b42318">Definite problem</text>
    <text x="1380" y="333" fill="#b54708">Needs a human</text>
    <text x="1380" y="463" fill="#067647">Verified correct</text>
  </g>
  <g font-size="13" fill="#475569">
    <text x="1380" y="226">Proven by maths, set</text><text x="1380" y="244">comparison, or barcode</text>
    <text x="1380" y="356">Uncertain, subjective or</text><text x="1380" y="374">AI-only: a person decides</text>
    <text x="1380" y="486">Checked and consistent</text><text x="1380" y="504">with the approved data</text>
  </g>

  <g filter="url(#sh)"><rect x="1305" y="555" width="270" height="145" rx="16" fill="#0f172a"/></g>
  <text x="1325" y="588" font-size="17" font-weight="700" fill="#fff">GreenLight web app</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="1325" y="614">• Evidence pinned on the artwork</text>
    <text x="1325" y="634">• Sheet cell and rule clause shown</text>
    <text x="1325" y="654">• Confirm or mark false alarm</text>
    <text x="1325" y="674">• Ask follow-ups · export reports</text>
  </g>

  <!-- ===== main arrows ===== -->
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="295" y1="242" x2="343" y2="242"/>
    <line x1="615" y1="287" x2="663" y2="287"/>
    <line x1="935" y1="287" x2="983" y2="287"/>
    <line x1="1255" y1="210" x2="1303" y2="210"/>
    <line x1="1255" y1="340" x2="1303" y2="340"/>
    <line x1="1255" y1="470" x2="1303" y2="470"/>
    <line x1="1440" y1="527" x2="1440" y2="553"/>
    <!-- sheet and rules go straight to the rule engine, underneath the extract/parse cards -->
    <line x1="295" y1="445" x2="983" y2="445"/>
    <line x1="295" y1="615" x2="983" y2="615"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#334155">
    <text x="640" y="437" text-anchor="middle">approved facts, with cell references</text>
    <text x="640" y="607" text-anchor="middle">regulation and company rules</text>
  </g>

  <!-- ===== optional AI layer ===== -->
  <g filter="url(#sh)"><rect x="345" y="745" width="910" height="105" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="9 6"/></g>
  <text x="367" y="777" font-size="17" font-weight="800" fill="#5b21b6">Optional AI layer · OpenAI</text>
  <text x="1233" y="777" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="end">Works fully offline without it</text>
  <g font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">
    <rect x="367" y="792" width="200" height="36" rx="18" fill="#fff" stroke="#c4b5fd"/><text x="467" y="815">Spot logos and marks</text>
    <rect x="581" y="792" width="200" height="36" rx="18" fill="#fff" stroke="#c4b5fd"/><text x="681" y="815">Route rulebook clauses</text>
    <rect x="795" y="792" width="210" height="36" rx="18" fill="#fff" stroke="#c4b5fd"/><text x="900" y="815">Judge unclear clauses</text>
    <rect x="1019" y="792" width="214" height="36" rx="18" fill="#fff" stroke="#c4b5fd"/><text x="1126" y="815">Answer follow-up questions</text>
  </g>
  <g stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)">
    <path d="M1120 745 V702"/>
  </g>
  <rect x="1130" y="711" width="125" height="25" rx="12" fill="#7c3aed"/>
  <text x="1192" y="728" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">can’t issue FAIL</text>
  <path d="M1255 800 H1440 V702" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>

  <!-- ===== guardrails ===== -->
  <text x="25" y="898" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">WHY YOU CAN TRUST THE ANSWER</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <g filter="url(#sh)">
      <rect x="25" y="912" width="296" height="70" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="337" y="912" width="296" height="70" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="649" y="912" width="296" height="70" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="961" y="912" width="296" height="70" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="1273" y="912" width="302" height="70" rx="14" fill="#fff" stroke="#cbd5e1"/>
    </g>
    <text x="173" y="940" fill="#0f172a">Deterministic first</text>
    <text x="485" y="940" fill="#0f172a">Three outcomes, not two</text>
    <text x="797" y="940" fill="#0f172a">The AI can’t convict</text>
    <text x="1109" y="940" fill="#0f172a">Evidence on every finding</text>
    <text x="1424" y="940" fill="#0f172a">A human has the last word</text>
  </g>
  <g font-size="12.5" fill="#64748b" text-anchor="middle">
    <text x="173" y="962">Every red comes from code, not opinion</text>
    <text x="485" y="962">Fail, review, pass; unsure is shown</text>
    <text x="797" y="962">AI-only findings capped at review</text>
    <text x="1109" y="962">Pin, sheet cell, rule clause, maths</text>
    <text x="1424" y="962">Confirm or false alarm, then export</text>
  </g>
</svg>
